  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {

  #hud-bar {

  .btn-arcade:active { transform: translateY(2px); }

    );

  }
  #intro-overlay {

    border: 4px solid #f7c948; border-radius: 6px;

    padding: 14px; text-align: center; z-index: 10;
  }
  #intro-overlay.hidden { display: none; }

    margin: 0 0 6px; letter-spacing: 2px;
  }
  #intro-sub {

  }
  #intro-art-box {
    position: relative; width: 240px; height: 170px;

    box-shadow: 0 0 18px rgba(56, 217, 115, 0.35);
  }

    width: 100%; height: 100%; object-fit: cover; display: block;
    image-rendering: pixelated;
  }
